version: '3.8'

services:
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.ml_service.main:app --host 0.0.0.0 --port 8000
    container_name: ml_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  course-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.course_service.main:app --host 0.0.0.0 --port 8001
    container_name: course_service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - ENVIRONMENT=production
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
